name: sessionmaxxing
services:
  sessionmaxxing:
    container_name: sessionmaxxing
    build:
      context: .
      args:
        RUNTIME_UID: "${SESSIONMAXXING_UID:?Set SESSIONMAXXING_UID in .env}"
        RUNTIME_GID: "${SESSIONMAXXING_GID:?Set SESSIONMAXXING_GID in .env}"
        RUNTIME_HOME: "${SESSIONMAXXING_HOME:?Set SESSIONMAXXING_HOME in .env}"
    user: "${SESSIONMAXXING_UID:?Set SESSIONMAXXING_UID in .env}:${SESSIONMAXXING_GID:?Set SESSIONMAXXING_GID in .env}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      HOME: "${SESSIONMAXXING_HOME:?Set SESSIONMAXXING_HOME in .env}"
      TZ: "${TZ:?Set TZ in .env to an IANA zone name}"
      SESSIONMAXXING_EDITION: "${SESSIONMAXXING_EDITION:?Set SESSIONMAXXING_EDITION in .env}"
      SESSIONMAXXING_ALLOWED_HOSTS: "${SESSIONMAXXING_BIND_ADDRESS:?Set SESSIONMAXXING_BIND_ADDRESS in .env},${SESSIONMAXXING_ALLOWED_HOSTS:-}"
    group_add:
      - "${SESSIONMAXXING_DOCKER_GID:?Set SESSIONMAXXING_DOCKER_GID in .env to the output of stat -c %g /var/run/docker.sock}"
    ports:
      - target: 4317
        published: "${SESSIONMAXXING_PORT:?Set SESSIONMAXXING_PORT in .env}"
        host_ip: "${SESSIONMAXXING_BIND_ADDRESS:?Set SESSIONMAXXING_BIND_ADDRESS in .env}"
        protocol: tcp
    volumes:
      # The identical HOME path supplies Claude session history and credentials.
      # The data directory lives under this mount, so no data volume exists.
      - type: bind
        source: "${SESSIONMAXXING_HOME:?Set SESSIONMAXXING_HOME in .env}"
        target: "${SESSIONMAXXING_HOME:?Set SESSIONMAXXING_HOME in .env}"
        bind:
          create_host_path: false
      # The server runs restart methods through the host docker daemon.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
