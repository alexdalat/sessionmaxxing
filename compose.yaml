name: sessionmaxxing
services:
  sessionmaxxing:
    container_name: sessionmaxxing
    build: .
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      HOME: /home/user
      SESSIONMAXXING_HOST: 0.0.0.0
      SESSIONMAXXING_PORT: "4317"
      TZ: America/New_York
    ports:
      - target: 4317
        published: "4317"
        host_ip: 192.0.2.10
        protocol: tcp
      - target: 4317
        published: "4317"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      # The identical HOME path supplies Claude session history and credentials.
      - type: bind
        source: /home/user
        target: /home/user
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        # Queue, runs, dispatch settings, and usage samples persist across image updates.
        target: /app/data
        bind:
          create_host_path: false
